name: edutech_app
description: EduTech — Learn, Practice, Excel
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # HTTP
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^10.3.1

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Facebook Login
  flutter_facebook_auth: ^7.1.1

  # YouTube player
  youtube_player_flutter: ^9.1.1

  # Payment
  razorpay_flutter: ^1.3.7

  # HTML rendering
  flutter_widget_from_html: ^0.15.2

  # Loading shimmer
  shimmer: ^3.0.0

  # Internationalization / date formatting
  intl: ^0.19.0

  # Firebase (push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local notifications (to show FCM messages while app is in foreground)
  flutter_local_notifications: ^18.0.1

  # Ads
  google_mobile_ads: ^5.1.0

  # WebView (for Paytm/PayU/Atom redirect payment flows)
  webview_flutter: ^4.10.0

  # Social sharing (exam results virality)
  share_plus: ^13.0.0

  # Current News module
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3

  # ── Content protection: secure PDF viewer + AES-256 encrypted offline store ──
  pdfx: ^2.6.0                 # in-app PDF viewer (renders pages to images; no share/print)
  encrypt: ^5.0.3             # AES-256 encryption for offline PDFs
  path_provider: ^2.1.4       # app sandbox documents dir (private storage)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-ExtraBold.ttf
          weight: 800
